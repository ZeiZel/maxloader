<?xml version="1.0" encoding="UTF-8"?>
<!--
  Editable Max Loader extension icon. The linked vendor SVG is an unmodified
  official MAX mark; the separate loader-badge group is extension artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 100 100" fill="none">
  <title>Max Loader extension icon</title>
  <desc>Official colored MAX mark, uniformly scaled without alteration, with a separate download badge.</desc>
  <g id="official-max-mark" transform="translate(48 48) scale(0.82) translate(-50 -50)">
    <image x="0" y="0" width="100" height="100" href="../vendor/max/Max colored.svg" xlink:href="../vendor/max/Max colored.svg"/>
  </g>
  <g id="loader-download-badge" aria-label="Max Loader extension-owned download badge">
    <!-- White backing maintains clear separation from the official mark. -->
    <circle cx="80" cy="80" r="17" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="14.5" fill="#0D001A"/>
    <!-- Download arrow and tray; intentionally separate from the MAX glyph. -->
    <path d="M80 70v11.2m0 0-4.5-4.5m4.5 4.5 4.5-4.5M72.8 86h14.4" fill="none" stroke="#00BFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
